name: Deploy (Cloudflare Pages)

# Läuft NACH einem erfolgreichen CI-Lauf auf main (siehe ci.yml: Lint,
# Typecheck, Unit-Tests, Build) und deployt dann den gebauten Stand nach
# Cloudflare Pages. Damit ist Git die einzige Quelle der Wahrheit für den
# Live-Stand -- kein manuelles "wrangler deploy" mehr am Repo vorbei nötig
# (das hat zuvor zu einem veralteten, separat als eigener Worker
# hochgeladenen Stand geführt, unabhängig vom hier gepflegten Code).
#
# Voraussetzung: In den Repo-Settings (Settings -> Secrets and variables ->
# Actions) müssen folgende Secrets angelegt sein:
#   - CLOUDFLARE_API_TOKEN   (Berechtigung: "Edit Cloudflare Workers"/Pages)
#   - CLOUDFLARE_ACCOUNT_ID  (aus dem Cloudflare-Dashboard, rechte Spalte)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Vorab pruefen, ob die Zugangsdaten ueberhaupt hinterlegt sind.
      # Ohne diesen Schritt scheitert erst wrangler ganz am Ende -- mit einer
      # Meldung, die im Log untergeht. Genau das ist passiert: Der Deploy ist
      # seit dem 30.08.2026 in JEDEM Lauf gescheitert (22 von 22), weil in
      # diesem Repo CLOUDFLARE_API_TOKEN fehlt, und es ist vier Tage lang
      # niemandem aufgefallen.
      - name: Zugangsdaten vorhanden?
        run: |
          fehlt=""
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || fehlt="$fehlt CLOUDFLARE_API_TOKEN"
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || fehlt="$fehlt CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$fehlt" ]; then
            echo "::error title=Deploy nicht moeglich::Diese Repo-Secrets fehlen:$fehlt"
            echo ""
            echo "Anlegen unter: Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "Dieselben Werte wie im Repo te-alltagstools-website; Secrets gelten immer nur"
            echo "fuer EIN Repo, sie werden nicht mitvererbt."
            exit 1
          fi
          echo "Beide Zugangsdaten sind hinterlegt."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=te-mini-games --branch=main
