<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0a1e" />
    <meta name="description" content="TE-Mini Games – Kurze Geschicklichkeits-, Gedächtnis-, Reaktions- und Logikspiele. Nur noch eine Runde." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TE-Mini Games" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>TE-Mini Games</title>

    <!--
      Startbilder fuer iOS. Android baut sich seinen Startbildschirm aus dem
      Manifest selbst; iOS zeigt ohne diese Zeilen beim Start der installierten
      App eine weisse Flaeche. Erzeugt von scripts/build-splash-screens.mjs --
      nicht von Hand pflegen.
    -->
    <link rel="apple-touch-startup-image" href="/splash/iphone-se-320x568@2x.png"
      media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-8-375x667@2x.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-8-plus-414x736@3x.png"
      media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-x-375x812@3x.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-xr-414x896@2x.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-xs-max-414x896@3x.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-12-390x844@3x.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-14-pro-393x852@3x.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-14-pro-max-430x932@3x.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/ipad-768x1024@2x.png"
      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/splash/ipad-pro-11-834x1194@2x.png"
      media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/splash/ipad-pro-12-1024x1366@2x.png"
      media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)" />

    <style>
      /*
        Der Startbildschirm der Seite selbst: Er steht schon im HTML und ist
        damit sofort da -- noch bevor JavaScript geladen ist. Sobald React
        gerendert hat, blendet main.tsx ihn aus. Ohne ihn sieht man beim
        Start je nach Verbindung eine Sekunde lang nichts.
      */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.1rem;
        background-color: #0d0a1e;
        background-image:
          radial-gradient(ellipse 90% 55% at 50% -10%, rgba(124, 58, 237, 0.38), transparent 60%),
          radial-gradient(ellipse 60% 45% at 100% 8%, rgba(56, 189, 248, 0.12), transparent 55%),
          radial-gradient(ellipse 70% 45% at 0% 100%, rgba(192, 132, 252, 0.16), transparent 55%);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity 220ms ease;
      }
      #splash[hidden] {
        display: none;
      }
      #splash.weg {
        opacity: 0;
        pointer-events: none;
      }
      #splash .symbol {
        width: 6.5rem;
        height: 6.5rem;
        border-radius: 1.5rem;
        border: 2px solid #a78bfa;
        background: linear-gradient(160deg, #2b2158, #1a1435);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.6rem;
        font-weight: 800;
        color: #f0c84a;
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.5), 0 0 22px rgba(139, 92, 246, 0.45);
      }
      #splash .name {
        font-size: 1.35rem;
        font-weight: 800;
        color: #f4f1ff;
      }
      #splash .claim {
        font-size: 0.8rem;
        font-weight: 600;
        color: #f0c84a;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="TE-Mini Games wird geladen">
      <div class="symbol" aria-hidden="true">TE</div>
      <div class="name">TE-Mini Games</div>
      <div class="claim">Nur noch eine Runde. ✨</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
