# Baut das Android-Paket (AAB) für Google Play und signiert es mit dem
# eigenen Upload-Schlüssel aus den Projektgeheimnissen.
#
# Seit 07.11.2026 ist die App eine Capacitor-Hülle (capacitor.config.ts)
# statt einer Trusted Web Activity -- damit AdMob geht. Die Hülle lädt die
# ausgelieferte Seite; gebaut wird hier nur die Hülle mit ihren Plugins.
# Paketname und Schlüssel sind dieselben wie bei der TWA: Für Google Play
# ist es dieselbe App.
#
# Nötige Geheimnisse (aus dem Ablauf "Android-Schlüssel erzeugen"):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD
# Optional als Variable (Settings → Secrets and variables → Variables):
#   ADMOB_APP_ID   ca-app-pub-…~…  -- ohne sie baut die App mit Googles
#                  Test-App-ID und zeigt nur Testvideos.
name: Android-Paket bauen

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Versionsname, wie er im Store steht (z. B. 1.1.0)'
        required: false
        default: ''
      versionCode:
        description: 'Versionsnummer -- muss bei jedem Upload zu Play größer sein als zuvor'
        required: false
        default: ''
  # Bei Änderungen an der Hülle von selbst bauen -- dann fällt ein kaputter
  # Bau sofort auf und nicht erst, wenn ein Update ansteht.
  push:
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-paket.yml'

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Geheimnisse prüfen
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SPEICHER: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SCHLUESSEL: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          fehlt=""
          [ -z "$KEYSTORE" ] && fehlt="$fehlt ANDROID_KEYSTORE_BASE64"
          [ -z "$SPEICHER" ] && fehlt="$fehlt ANDROID_KEYSTORE_PASSWORD"
          [ -z "$SCHLUESSEL" ] && fehlt="$fehlt ANDROID_KEY_PASSWORD"
          if [ -n "$fehlt" ]; then
            echo "::error::Diese Geheimnisse fehlen:$fehlt -- erst den Ablauf \"Android-Schlüssel erzeugen\" starten."
            exit 1
          fi

      - name: Eingaben prüfen
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          VERSION_CODE: ${{ inputs.versionCode }}
        run: |
          if [ -n "$VERSION_CODE" ] && ! printf '%s' "$VERSION_CODE" | grep -qE '^[1-9][0-9]*$'; then
            echo "::error::versionCode muss eine ganze Zahl sein (1, 2, 3 ...), nicht \"$VERSION_CODE\". Der Text, den Nutzer sehen, gehört in versionName."
            exit 1
          fi
          if [ -n "$VERSION_NAME" ] && ! printf '%s' "$VERSION_NAME" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::versionName sieht aus wie 1.0.0 oder 1.2 -- nicht \"$VERSION_NAME\"."
            exit 1
          fi

      - name: Gradle-Zwischenspeicher
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: gradle-

      - name: Hülle vorbereiten
        run: |
          npm ci
          # Capacitor will einen Web-Ordner zum Einpacken, auch wenn die App
          # die Seite aus dem Netz lädt -- er dient als Rückfall.
          npm run build
          npx cap sync android

      - name: Schlüssel bereitlegen
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SPEICHER: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Leerzeichen und Zeilenumbrüche rauswerfen: Beim Einfügen in die
          # Oberfläche von GitHub rutschen leicht welche mit hinein.
          printf '%s' "$KEYSTORE" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/android.keystore" 2>/dev/null || true
          if [ ! -s "$RUNNER_TEMP/android.keystore" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 lässt sich nicht als Base64 lesen."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/android.keystore" -storepass "$SPEICHER" -alias te-mini-games >/dev/null 2>&1; then
            echo "::error::Kein lesbarer Schlüsselspeicher mit dem Alias te-mini-games -- falscher Inhalt oder falsches ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "Schlüsselspeicher gelesen."

      - name: Bauen und signieren
        env:
          TE_KEYSTORE_PATH: ${{ runner.temp }}/android.keystore
          TE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.versionName }}
          VERSION_CODE: ${{ inputs.versionCode }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: |
          cd android
          chmod +x gradlew
          EXTRA=""
          [ -n "$VERSION_CODE" ] && EXTRA="$EXTRA -PteVersionCode=$VERSION_CODE"
          [ -n "$VERSION_NAME" ] && EXTRA="$EXTRA -PteVersionName=$VERSION_NAME"
          [ -n "$ADMOB_APP_ID" ] && EXTRA="$EXTRA -PteAdmobAppId=$ADMOB_APP_ID"
          ./gradlew --no-daemon bundleRelease assembleRelease $EXTRA

      - name: Nachsehen, was entstanden ist
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          ls -l "$APK" "$AAB"
          WERKZEUGE=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          {
            echo '### Gebautes Paket'
            echo '```'
            "$WERKZEUGE/aapt2" dump badging "$APK" | head -1
            "$WERKZEUGE/aapt2" dump badging "$APK" | grep -o "com.google.android.gms.ads.APPLICATION_ID[^ ]*" || true
            echo '```'
            echo 'SHA-256 des Upload-Schlüssels:'
            echo '```'
            "$WERKZEUGE/apksigner" verify --print-certs "$APK" | grep 'SHA-256 digest'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          "$WERKZEUGE/apksigner" verify --print-certs "$APK" | grep 'SHA-256 digest'

      - name: Paket bereitstellen
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: te-mini-games-android
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
